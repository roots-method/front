<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Arka — LinkedIn banner</title>

<!-- LinkedIn profile cover, 1584x396 (same size as assets/ln-bannerblue.png).

     TO EXPORT A PNG: serve the repo, open this in Chrome, then in DevTools
     Elements right-click the <div class="banner"> node and choose "Capture
     node screenshot". That writes a pixel-exact 1584x396 file. A plain window
     screenshot is scaled by your display DPI and comes out the wrong size.

     Fonts load from /fonts, so serve over http; a file:// URL will not resolve
     the @font-face rules.

     The cells are WHITE at low opacity, not cobalt. On a cobalt ground the
     accent colour is invisible against itself, so the grid is drawn as light
     on dark and the brand colour is carried by the background instead.

     LinkedIn overlaps your profile photo on the LOWER LEFT of a profile cover
     on desktop. All the text is kept right of centre so nothing is hidden. -->

<style>
@font-face { font-family:"Barlow"; src:url("/fonts/Barlow/Barlow-Light.ttf") format("truetype"); font-weight:300; font-display:block; }
@font-face { font-family:"Barlow"; src:url("/fonts/Barlow/Barlow-Regular.ttf") format("truetype"); font-weight:400; font-display:block; }
@font-face { font-family:"Nunito Sans"; src:url("/fonts/Nunito_Sans/NunitoSans-VariableFont_YTLC,opsz,wdth,wght.ttf") format("truetype-variations"); font-weight:200 1000; font-display:block; }

:root { --brand:#0047ab; --on-brand-soft:#dbe8f8; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#d2d7e1; display:grid; place-items:center; min-height:100vh; padding:24px; }

.banner {
  position:relative;
  width:1584px; height:396px;
  background:var(--brand);
  overflow:hidden;
  font-family:"Nunito Sans",system-ui,sans-serif;
}

/* Full bleed: the grid covers the whole banner, no fade or crop. */
.banner__grid { position:absolute; inset:0; }
.banner__grid svg { display:block; width:100%; height:100%; }
.c    { fill:none; stroke:#fff; stroke-width:1; stroke-opacity:.20; }
.lit  { fill:#fff; fill-opacity:.11; }
.chip { fill:#fff; fill-opacity:.20; }

.banner__copy { position:absolute; left:770px; right:70px; top:50%; transform:translateY(-50%); }
.tag  { font-family:"Barlow",sans-serif; font-weight:300; font-size:44px; line-height:1.18;
         letter-spacing:-.01em; color:#fff; }
.mail { font-size:22px; font-weight:600; color:var(--on-brand-soft); margin-top:26px; }
</style>
</head>
