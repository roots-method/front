<!-- Arka wordmark: lowercase "arka" cut from eight horizontal bands.
     k spans all eight (ascender); a and r sit on the bottom five (x-height).
     The a is double-storey on purpose — a single-storey one has no curves to
     distinguish it from an o at this resolution, and the word read "orko". -->
