<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(232,160,48,0.05)" stroke-width="0.8"/>
    </pattern>
    <!-- Amber glow -->
    <radialGradient id="glow" cx="0%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#e8a030" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#e8a030" stop-opacity="0"/>
    </radialGradient>
    <!-- Bottom strip gradient -->
    <linearGradient id="strip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8a030" stop-opacity="1"/>
      <stop offset="55%" stop-color="#e8a030" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e8a030" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="#0d1117"/>

  <!-- Grid texture -->
  <rect width="1200" height="627" fill="url(#grid)"/>

  <!-- Amber glow top-left -->
  <ellipse cx="0" cy="0" rx="500" ry="500" fill="url(#glow)"/>

  <!-- ─── Orbital diagram (right side) ─── -->
  <!-- Rings -->
  <circle cx="920" cy="314" r="100" fill="none" stroke="rgba(232,160,48,0.16)" stroke-width="1.2"/>
  <circle cx="920" cy="314" r="168" fill="none" stroke="rgba(232,160,48,0.10)" stroke-width="1"/>
  <circle cx="920" cy="314" r="236" fill="none" stroke="rgba(232,160,48,0.06)" stroke-width="0.8"/>

  <!-- Connector lines from core to nodes -->
  <line x1="920" y1="314" x2="978" y2="242" stroke="rgba(232,160,48,0.22)" stroke-width="0.9"/>
  <line x1="920" y1="314" x2="776" y2="404" stroke="rgba(232,160,48,0.16)" stroke-width="0.9"/>
  <line x1="920" y1="314" x2="1068" y2="356" stroke="rgba(232,160,48,0.13)" stroke-width="0.9"/>

  <!-- Orbital nodes -->
  <circle cx="978" cy="242" r="5" fill="#e8a030" opacity="0.9"/>
  <circle cx="776" cy="404" r="4.5" fill="#e8a030" opacity="0.7"/>
  <circle cx="1068" cy="356" r="3.5" fill="#e8a030" opacity="0.6"/>
  <circle cx="816" cy="196" r="3" fill="#e8a030" opacity="0.45"/>
  <circle cx="1040" cy="480" r="2.5" fill="#e8a030" opacity="0.35"/>

  <!-- Core halo -->
  <circle cx="920" cy="314" r="28" fill="rgba(232,160,48,0.07)" stroke="rgba(232,160,48,0.28)" stroke-width="1.2"/>
  <!-- Core -->
  <circle cx="920" cy="314" r="11" fill="#e8a030" opacity="0.95"/>

  <!-- ─── Brand mark (top-left) ─── -->
  <!-- Amber snowflake / star shape approximated as a scaled version -->
  <image href="arkaflow-newlogo.svg" x="72" y="64" width="52" height="52"/>

  <!-- Brand name -->
  <text x="138" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#f0ece4" letter-spacing="-0.5">Arka</text>

  <!-- ─── Headline ─── -->
  <text x="72" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="88" font-weight="800" fill="#f0ece4" letter-spacing="-2.5">AI for</text>
  <text x="72" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="88" font-weight="800" fill="#e8a030" letter-spacing="-2.5">Enterprise</text>
  <text x="72" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="88" font-weight="800" fill="#f0ece4" letter-spacing="-2.5">Operations.</text>

  <!-- ─── Tagline ─── -->
  <text x="72" y="516" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="rgba(240,236,228,0.5)" letter-spacing="-0.3">Building Intelligent Software for Enterprise Operations.</text>

  <!-- ─── Domain ─── -->
  <text x="1128" y="599" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="rgba(240,236,228,0.28)" letter-spacing="0.5" text-anchor="end">arkaflow.co</text>

  <!-- Bottom amber strip -->
  <rect x="0" y="623" width="1200" height="4" fill="url(#strip)"/>
</svg>
